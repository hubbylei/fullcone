name: Update
env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  Update:
    runs-on: ubuntu-latest

    steps:
    - name: Initialization environment
      run: sudo timedatectl set-timezone "$TZ"

    - name: Checkout
      uses: actions/checkout@main

    - name: Get source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH /tmp/openwrt
        rm -rf *
        cp -rf /tmp/openwrt/package/network/services/fullconenat* ./
        sed 's,PKG_MIRROR_HASH:=.*,PKG_MIRROR_HASH:=skip,g' ./fullconenat/Makefile
        sed 's,PKG_MIRROR_HASH:=.*,PKG_MIRROR_HASH:=skip,g' ./fullconenat-nft/Makefile

    - name: Creat Message
      id: msg
      run: echo "commit_message=Update $(date +"%Y-%m-%d %H:%M:%S")" >> "$GITHUB_OUTPUT"
 
    - name: Apply Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
         commit_message: ${{ steps.msg.outputs.commit_message }}
         branch: main

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 5
